name: gw-source
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy
  - scipy
  - matplotlib
  - pytest
  - xarray
  - netcdf4
  - geopandas
  - shapely
  - jupyterlab
  - ipykernel
  - nbclient
  - nbformat
  - nbconvert
  - pyemu
  - pip
  - pip:
      - flopy[codegen] @ git+https://github.com/modflowpy/flopy.git@develop
      - -e .
      # optional, tutorials only: the Voronoi grid of tutorial 04 (gwsource itself does not need it)
      - vorflow==0.2.0
