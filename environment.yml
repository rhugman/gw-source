name: gw-source
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy
  - scipy
  - matplotlib
  - pytest
  - xarray
  - netcdf4
  - geopandas
  - shapely
  - jupyterlab
  - ipykernel
  - nbclient
  - nbformat
  - nbconvert
  - pip
  - pip:
      - flopy[codegen] @ git+https://github.com/modflowpy/flopy.git@develop
      - -e .
