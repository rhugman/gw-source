name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC, to catch upstream FloPy/MF6 changes
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash -el {0}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # avoids API rate limits in get-modflow
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for gmsh (vorflow)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Set up the gw-source environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: gw-source
          cache-environment: false
          init-shell: bash

      # The same script users run (README, CONTRIBUTING), so CI checks it on every OS.
      - name: FloPy develop, MF6 classes, and MODFLOW 6, triangle and PEST++ into bin/
        run: python scripts/setup_env.py

      - name: Run tests
        run: pytest -v

      # The notebooks and the benchmark-sized checks are deselected by default (pyproject.toml
      # addopts); run them on the weekly schedule and on manual runs only, even if the step above failed.
      - name: Run tutorial and slow tests
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: pytest -v -m "tutorials or slow"
