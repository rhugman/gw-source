<title>Paper Draft (Examples)</title>
<script>window.MathJax = { tex: { displayMath: [["$$", "$$"]], inlineMath: [["$", "$"]] }, svg: { fontCache: "global" } };</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg-full.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: manuscript column (~68ch) with a sticky contents rail on wide screens; tables and figures may run wider than the text. */
:root {
  --bg: #f7f8f9; --surface: #ffffff; --fg: #1b2530; --muted: #5a6876; --rule: #d7dde3;
  --accent: #1f5f8b; --accent-soft: #e3edf5; --ok: #2f6f4f; --ok-soft: #e2f0e8; --todo: #8a5a00; --todo-soft: #f8ecd2;
  --f-body: "Literata", Georgia, "Times New Roman", serif;
  --f-head: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --step--1: 0.84rem; --step0: 1rem; --step1: 1.2rem; --step2: 1.5rem; --step3: 1.9rem;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12171c; --surface: #182029; --fg: #dde4ea; --muted: #98a6b3; --rule: #2c3743;
  --accent: #7fb6dd; --accent-soft: #1c3042; --ok: #8fd0ad; --ok-soft: #1b3328; --todo: #e7bb68; --todo-soft: #3a2e14; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12171c; --surface: #182029; --fg: #dde4ea; --muted: #98a6b3; --rule: #2c3743;
  --accent: #7fb6dd; --accent-soft: #1c3042; --ok: #8fd0ad; --ok-soft: #1b3328; --todo: #e7bb68; --todo-soft: #3a2e14; color-scheme: dark }

html { font-size: 17px; scroll-padding-top: 1rem; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); line-height: 1.6; padding-inline: 16px; }
.wrap { max-width: 76rem; margin: 0 auto; padding-block: 2rem 4rem; display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: 3rem; }
nav { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; max-height: 100vh; overflow-y: auto; padding-block: 1rem; font-family: var(--f-head); font-size: var(--step--1); }
nav ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.2rem; }
nav .l3 { padding-left: 0.9rem; color: var(--muted); }
nav a { color: inherit; text-decoration: none; display: block; padding: 0.1rem 0.4rem; border-radius: 3px; }
nav a:hover, nav a:focus-visible { background: var(--accent-soft); color: var(--accent); outline: none; }
nav .label { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.72rem; color: var(--muted); margin-bottom: 0.5rem; }
main { min-width: 0; max-width: 46rem; }
header { border-bottom: 1px solid var(--rule); padding-bottom: 1.2rem; margin-bottom: 1.5rem; }
.meta { font-family: var(--f-mono); font-size: 0.74rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0.4rem 1.2rem; text-transform: uppercase; letter-spacing: 0.04em; }
.meta b { color: var(--fg); font-weight: 500; }
h1, h2, h3 { font-family: var(--f-head); font-weight: 600; text-wrap: balance; line-height: 1.2; }
h1 { font-size: var(--step3); margin: 0.6rem 0 0; }
h2 { font-size: var(--step2); margin: 2.6rem 0 0.8rem; padding-top: 0.6rem; border-top: 2px solid var(--fg); }
h3 { font-size: var(--step1); margin: 1.8rem 0 0.5rem; color: var(--accent); }
p, li { max-width: 68ch; }
p { margin: 0.7rem 0; }
ul, ol { padding-left: 1.3rem; }
li { margin: 0.35rem 0; }
li::marker { color: var(--muted); }
a { color: var(--accent); }
strong { font-weight: 600; }
code { font-family: var(--f-mono); font-size: 0.8em; background: var(--accent-soft); padding: 0.05em 0.3em; border-radius: 3px; overflow-wrap: anywhere; }
.ev { font-family: var(--f-head); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.chk { font-family: var(--f-head); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; background: var(--todo-soft); color: var(--todo); padding: 0.05em 0.4em; border-radius: 3px; }
.pill { font-family: var(--f-head); font-size: 0.74rem; padding: 0.1em 0.5em; border-radius: 99px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.todo { background: var(--todo-soft); color: var(--todo); }
.tbl { overflow-x: auto; margin: 1rem 0; }
.wide table { min-width: 56rem; }
.eq { overflow-x: auto; margin: 1rem 0; }
.si { font-family: var(--f-head); font-size: 0.78rem; background: var(--todo-soft); color: var(--todo); padding: 0.05em 0.35em; border-radius: 3px; }
.tblock { margin: 1.5rem 0; font-size: 0.9rem; }
main figure { margin: 1.5rem 0; }
.wide table { min-width: 58rem; }
table { border-collapse: collapse; font-size: 0.84rem; line-height: 1.45; min-width: 36rem; width: 100%; }
th { font-family: var(--f-head); font-weight: 600; text-align: left; border-bottom: 1.5px solid var(--fg); padding: 0.4rem 0.6rem 0.3rem 0; }
td { border-bottom: 1px solid var(--rule); padding: 0.45rem 0.6rem 0.45rem 0; vertical-align: top; font-variant-numeric: tabular-nums; }
.figs { display: grid; gap: 2rem; margin-top: 1rem; }
figure { margin: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: 1rem; }
figure img { display: block; width: 100%; max-width: 100%; height: auto; background: #fff; border-radius: 2px; }
figcaption { font-size: 0.84rem; line-height: 1.5; margin-top: 0.8rem; color: var(--fg); }
figcaption b { font-family: var(--f-head); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 0; }
  nav { position: static; max-height: none; border-bottom: 1px solid var(--rule); margin-bottom: 1rem; }
  nav .l3 { display: none; }
  html { font-size: 16px; }
}
</style>

<div class="wrap">
  <nav aria-label="Contents">
    <div class="label">Contents</div>
    <ol>{{TOC}}</ol>
  </nav>
  <main>
    <header>
      <div class="meta"><span>Full draft</span><span>branch <b>paper-draft-alt</b> · <b>{{COMMIT}}</b></span><span><b>{{WORDS}}</b> words in the main text</span><span><b>{{NCHECK}}</b> open checks</span></div>
      <h1>{{H1}}</h1>
    </header>
    {{BODY}}
  </main>
</div>
